name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            TURSO_DATABASE_URL: file:ci.db
            TURSO_AUTH_TOKEN: ''

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Use Node.js 26.5.0
              uses: actions/setup-node@v7
              with:
                  node-version: 26.5.0
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Apply migrations to an empty database
              run: npm run db:migrate

            - name: Verify migration history and integrity
              run: npm run db:migrate:verify

            - name: Audit production dependencies
              run: npm audit --omit=dev
